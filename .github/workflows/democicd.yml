
name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build \
            -t priyankayadav08/python-app:${{ github.sha }} \
            -t priyankayadav08/python-app:v1.0 \
            .

      - name: Verify Docker image
        run: docker image inspect priyankayadav08/python-app:${{ github.sha }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image v1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push priyankayadav08/python-app:v1.0

      - name: Push Docker image with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push priyankayadav08/python-app:${{ github.sha }}
