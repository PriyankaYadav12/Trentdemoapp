name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t python-app:${{ github.sha }} .

      - name: Verify Docker image
        run: docker image inspect python-app:${{ github.sha }}
        
      - name: tag Docker image
        run: docker tag python-app:v1.0 priyankayadav08/python-app:v1.0 
        
      - name: Push Docker Image respective registry
        run: docker push priyankayadav08/python-app:v1.0 

       
